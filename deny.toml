[graph]
# If 1 or more target triples (and optionally, target_features) are specified,
# only the specified targets will be checked when running `cargo deny check`.
# This means, if a particular package is only ever used as a target specific
# dependency, such as, for example, the `nix` crate only being used via the
# `target_family = "unix"` configuration, that only having windows targets in
# this list would mean the nix crate, as well as any of its exclusive
# dependencies not shared by any other crates, would be ignored, as the target
# list here is effectively saying which targets you are building for.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-unknown-linux-musl" },
]

# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
version = 2
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# The lint level for crates that have been yanked from their source registry
ignore = [
  # | Marvin Attack: potential key recovery through timing sidechannels
  # | in `rsa 0.9.3`.
  # | Solution: No safe upgrade is available!
  #
  # This library is used as a dependency of `openidconnect 3.4.0`, so unless we
  # want to replace that no further action is available until either:
  # - openidconnect switches to a different dependency
  # - rsa releases a fixed version
  "RUSTSEC-2023-0071",

  # | rustls-pemfile is unmaintained
  # |
  # | The rustls-pemfile crate is no longer maintained. The repository has been archived since August
  # | 2025, and users are encouraged to depend directly on the underlying PEM parsing code included
  # | in rustls-pki-types since 1.9.0. The latest version of rustls-pemfile is in fact a thin wrapper
  # | around the same code used in rustls-pki-types, so migrating should be straightforward.
  #
  # We need to wait until dependencies update to an alternative crate.
  "RUSTSEC-2025-0134",

  # | yaml-rust is unmaintained.
  # |
  # | Advisory: https://rustsec.org/advisories/RUSTSEC-2024-0320
  # | The maintainer seems [unreachable](https://github.com/chyh1990/yaml-rust/issues/197).
  # |
  # | Many issues and pull requests have been submitted over the years
  # | without any [response](https://github.com/chyh1990/yaml-rust/issues/160).
  # |
  # | ## Alternatives
  # |
  # | Consider switching to the actively maintained `yaml-rust2` fork of the original project:
  # |
  # | - [yaml-rust2](https://github.com/Ethiraric/yaml-rust2)
  # | - [yaml-rust2 @ crates.io](https://crates.io/crates/yaml-rust2)
  # | Announcement: https://github.com/rustsec/advisory-db/issues/1921
  # | Solution: No safe upgrade is available!
  #
  # This is a transitive dependency, so we can't just switch, but must instead wait for
  # our dependencies to do so.
  "RUSTSEC-2024-0320",

  # | Bincode is unmaintained
  # |
  # | Due to a doxxing and harassment incident, the bincode team has taken the decision to cease development permanently.
  # |
  # | The team considers version 1.3.3 a complete version of bincode that is not in need of any updates.
  # |
  # | ## Alternatives to consider
  # |
  # | * [wincode](https://crates.io/crates/wincode)
  # | * [postcard](https://crates.io/crates/postcard)
  # | * [bitcode](https://crates.io/crates/bitcode)
  # | * [rkyv](https://crates.io/crates/rkyv)
  # |
  # | Announcement: https://git.sr.ht/~stygianentity/bincode/tree/v3.0/item/README.md
  # | Solution: No safe upgrade is available!
  #
  # This is a transitive dependency, so we can't just switch, but must instead wait for
  # our dependencies to do so.
  "RUSTSEC-2025-0141",

  # | paste - no longer maintained
  # |
  # | The creator of the crate `paste` has stated in the [`README.md`](https://github.com/dtolnay/paste/blob/master/README.md)
  # | that this project is not longer maintained as well as archived the repository
  # |
  # | ## Possible Alternative(s)
  # |
  # | - [`pastey`]: a fork of paste and is aimed to be a drop-in replacement with additional features for paste crate
  # | - [`with_builtin_macros`]: crate providing a [superset of `paste`'s functionality including general `macro_rules!` eager expansions](https://docs.rs/with_builtin_macros/0.1.0/with_builtin_macros/macro.with_eager_expansions.html)  and `concat!`/`concat_idents!` macros

  # | [`pastey`]: https://crates.io/crates/pastey
  # | [`with_builtin_macros`]: https://crates.io/crates/with_builtin_macros
  # | Announcement: https://github.com/dtolnay/paste
  # | Solution: No safe upgrade is available!
  #
  # This is a transitive dependency, so we can't just switch, but must instead wait for
  # our dependencies to do so.
  "RUSTSEC-2024-0436",

  # rustls-webpki
  #
  # | Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0098
  # |
  # | Name constraints for URI names were ignored and therefore accepted.
  # |
  # | Note this library does not provide an API for asserting URI names, and URI name constraints are otherwise not implemented.  URI name constraints are now rejected unconditionally.
  # |
  # | Since name constraints are restrictions on otherwise properly-issued certificates, this bug is reachable only after signature verification and requires misissuance to exploit.
  # |
  # | This vulnerability is identified as [GHSA-965h-392x-2mh5](https://github.com/rustls/webpki/security/advisories/GHSA-965h-392x-2mh5). Thank you to @1seal for the report.
  # | Solution: Upgrade to >=0.103.12, <0.104.0-alpha.1 OR >=0.104.0-alpha.6 (try `cargo update -p rustls-webpki`)
  #
  # This version of the rustls-webpki crate is pulled in as a transitive dependency of actix-web, and so far
  # no updated version which matches the compatible range is available, so we have to wait until the dependency
  # tree of actix-web becomes compatible / updated.
  "RUSTSEC-2026-0098",

  # rustls-webpki
  #
  # | rustls-webpki 0.101.7 registry+https://github.com/rust-lang/crates.io-index
  # |
  # | Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0099
  # | Permitted subtree name constraints for DNS names were accepted for certificates asserting a wildcard name.
  # |
  # | This was incorrect because, given a name constraint of `accept.example.com`, `*.example.com` could feasibly allow a name of `reject.example.com` which is outside the constraint.
  # | This is very similar to [CVE-2025-61727](https://go.dev/issue/76442).
  # |
  # | Since name constraints are restrictions on otherwise properly-issued certificates, this bug is reachable only after signature verification and requires misissuance to exploit.
  # |
  # | This vulnerability is identified as [GHSA-xgp8-3hg3-c2mh](https://github.com/rustls/webpki/security/advisories/GHSA-xgp8-3hg3-c2mh). Thank you to @1seal for the report.
  # | Solution: Upgrade to >=0.103.12, <0.104.0-alpha.1 OR >=0.104.0-alpha.6 (try `cargo update -p rustls-webpki`)
  #
  # This version of the rustls-webpki crate is pulled in as a transitive dependency of actix-web, and so far
  # no updated version which matches the compatible range is available, so we have to wait until the dependency
  # tree of actix-web becomes compatible / updated.
  "RUSTSEC-2026-0099",

  # rustls-webpki
  #
  # | rustls-webpki 0.101.7 registry+https://github.com/rust-lang/crates.io-index
  # |
  # | Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0099
  # | Permitted subtree name constraints for DNS names were accepted for certificates asserting a wildcard name.
  # |
  # | This was incorrect because, given a name constraint of `accept.example.com`, `*.example.com` could feasibly allow a name of `reject.example.com` which is outside the constraint.
  # | This is very similar to [CVE-2025-61727](https://go.dev/issue/76442).
  # |
  # | Since name constraints are restrictions on otherwise properly-issued certificates, this bug is reachable only after signature verification and requires misissuance to exploit.
  # |
  # | This vulnerability is identified as [GHSA-xgp8-3hg3-c2mh](https://github.com/rustls/webpki/security/advisories/GHSA-xgp8-3hg3-c2mh). Thank you to @1seal for the report.
  # | Solution: Upgrade to >=0.103.12, <0.104.0-alpha.1 OR >=0.104.0-alpha.6 (try `cargo update -p rustls-webpki`)
  #
  # This version of the rustls-webpki crate is pulled in as a transitive dependency of actix-web, and so far
  # no updated version which matches the compatible range is available, so we have to wait until the dependency
  # tree of actix-web becomes compatible / updated.
  "RUSTSEC-2026-0104",

  # proc-macro-error2
  #
  # | proc-macro-error2 2.0.1 registry+https://github.com/rust-lang/crates.io-index
  # |
  # | Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0173
  # | The author of `proc-macro-error2` has [confirmed](https://github.com/GnomedDev/proc-macro-error-2/issues/17#issuecomment-4643215473) that the crate is no longer maintained and recommends that users migrate away from it.
  # |
  # | `proc-macro-error2` was originally created as a maintained fork of [`proc-macro-error`](https://crates.io/crates/proc-macro-error) (see [RUSTSEC-2024-0370](https://rustsec.org/advisories/RUSTSEC-2024-0370)). Both the original crate and this fork are now unmaintained.
  # |
  # | ## Possible Alternative(s)
  # |
  # | - [manyhow](https://crates.io/crates/manyhow)
  # | - [proc-macro2-diagnostics](https://github.com/SergioBenitez/proc-macro2-diagnostics)
  # | Announcement: https://github.com/GnomedDev/proc-macro-error-2/issues/17
  # | Solution: No safe upgrade is available!
  #
  # tabled-derive v0.11.0 depends on proc-macro-error2, which is a currently unmaintained fork of proc-macro-error.
  # Suppressed until tabled drops or replaces it.
  "RUSTSEC-2026-0173",

  # ttf-parser
  #
  # | Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0192.html
  # | The author of `ttf-parser` has stated that the crate is unmaintained and will not receive further fixes (see the referenced issue).
  # |
  # | ## Alternative(s)
  # |
  # | - [`skrifa`](https://crates.io/crates/skrifa), an actively maintained TrueType and OpenType font parsing crate, part of the Google Fonts "oxidize" (`fontations`) project.
  #
  # typst-pdf v0.14.2 depends on ttf-parser v0.25.1, which is curretnlty unmaintained.
  # We have to wait until typst-pdf drops or replaces it.
  "RUSTSEC-2026-0192",

  # quick-xml
  #
  # | Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0194
  # | Quadratic run time when checking a start tag for duplicate attribute names.
  # |
  # | `BytesStart::attributes()` returns an `Attributes` iterator which, by default
  # | (`with_checks(true)`), rejects a start tag that repeats an attribute name. For
  # | each attribute yielded, the iterator compared the new name against every name
  # | seen so far in the same tag using a linear scan, so a start tag with `N`
  # | distinct attribute names cost `O(N²)` byte comparisons.
  # | Solution: Upgrade to >=0.41.0 (try `cargo update -p quick-xml`)
  #
  # quick-xml v0.38.4 is pulled in as a transitive dependency of typst-library
  # (via citationberg). We have to wait until typst-library updates its dependency
  # tree to receive a compatible version.
  "RUSTSEC-2026-0194",

  # quick-xml
  #
  # | Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0195
  # | Unbounded namespace-declaration allocation in `NsReader` enables
  # | memory-exhaustion denial of service.
  # |
  # | `NsReader` resolves namespaces by calling `NamespaceResolver::push` for every
  # | `Start`/`Empty` event *before* the event is returned to the caller. `push`
  # | iterated all `xmlns` / `xmlns:*` attributes on the start tag and, for each one,
  # | pushed an entry into an unbounded internal buffer.
  # | Solution: Upgrade to >=0.41.0 (try `cargo update -p quick-xml`)
  #
  # quick-xml v0.39.4 is pulled in as a transitive dependency of typst-library
  # (via syntect -> plist -> two-face). We have to wait until typst-library
  # updates its dependency tree to receive a compatible version.
  "RUSTSEC-2026-0195",

  # `rustybuzz` is unmaintained
  "RUSTSEC-2026-0206",

  # The h2 crate, used internally by hyper, had a flaw that would accept and queue empty DATA frames without limit.
  # If streams were not actively drained, this could lead to unbounded memory usage, or a panic if the length overflows.
  # Low severity.
  #
  # Announcement: https://github.com/hyperium/hyper/security/advisories/GHSA-q83h-524g-xf6h
  #
  # This version of h2 is a transient dependency pulled in by actix-web.
  "RUSTSEC-2026-0258",
] # A list of advisory IDs to ignore. Note that ignored advisories will still
yanked = "deny"
# output a note when they are encountered.
# Threshold for security vulnerabilities, any vulnerability with a CVSS score
# lower than the range specified will be ignored. Note that ignored advisories
# will still output a note when they are encountered.
# * None - CVSS Score 0.0
# * Low - CVSS Score 0.1 - 3.9
# * Medium - CVSS Score 4.0 - 6.9
# * High - CVSS Score 7.0 - 8.9
# * Critical - CVSS Score 9.0 - 10.0
#severity-threshold =

