    EventResourceDate:
      oneOf:
        - type: object
          description: Represents a date without a recurrence pattern.
          required:
            - starts_at
            - ends_at
            - type
          properties:
            ends_at:
              $ref: "#/components/schemas/DateTimeTz"
              description: |-
                End time of the event.

                For recurring events these must contain the datetime of the first instance.
            is_all_day:
              type: boolean
              description: |-
                Should the event be all-day?

                If true, requires `starts_at.datetime` and `ends_at.datetime` to have a 00:00 time part.
            starts_at:
              $ref: "#/components/schemas/DateTimeTz"
              description: |-
                Start time of the event.

                For recurring events these must contain the datetime of the first instance.
            type:
              type: string
              enum:
                - single
        - type: object
          description: Represens a date with recurrence pattern.
          required:
            - starts_at
            - ends_at
            - type
          properties:
            ends_at:
              $ref: "#/components/schemas/DateTimeTz"
              description: |-
                End time of the event.

                For recurring events these must contain the datetime of the first instance.
            is_all_day:
              type: boolean
              description: |-
                Should the event be all-day?

                If true, requires `starts_at.datetime` and `ends_at.datetime` to have a 00:00 time part.
            recurrence_pattern:
              $ref: "#/components/schemas/RecurrencePattern"
              description: |-
                Recurrence pattern(s) for recurring events.

                Contains a list of recurrence rules which describe the occurrences of the event.

                # Allowed Values

                - `RRULE`
                - `RDATE`
                - `EXRULE`
                - `EXDATE`

                # Forbidden Values

                - `DTSTART`
                - `DTEND`

                This information is stored in the `starts_at` and `ends_at` fields.
            starts_at:
              $ref: "#/components/schemas/DateTimeTz"
              description: |-
                Start time of the event.

                For recurring events these must contain the datetime of the first instance.
            type:
              type: string
              enum:
                - recurring
      description: Representing event date related information.
      example:
        ends_at:
          datetime: "2002-04-01T11:41:35Z"
          timezone: Europe/Berlin
        is_all_day: true
        recurrence_pattern:
          - FREQ=WEEKLY;INTERVAL=1;BYDAY=MO
        starts_at:
          datetime: "2002-04-01T10:41:35Z"
          timezone: Europe/Berlin
        type: recurring
    EventResourceDateKind:
      oneOf:
        - type: object
          description: Event is not bound to specific times.
          required:
            - type
            - is_time_independent
          properties:
            is_time_independent:
              $ref: "#/components/schemas/TimeIndependentMarker"
              description: |-
                Should the created event be time independent?

                If true, all following fields must be null.
                If false, requires `is_all_day`, `starts_at`, `ends_at`.
            type:
              $ref: "#/components/schemas/SingleMarker"
              description: Indicates that the event has no recurrence_pattern.
        - allOf:
            - $ref: "#/components/schemas/EventResourceDate"
              description: Represents all date related information of the respective event.
            - type: object
              required:
                - is_time_independent
              properties:
                is_time_independent:
                  $ref: "#/components/schemas/TimeDependentMarker"
                  description: Marker field to identify this variant during deserialization.
          description: Event is bound to specific times.
      description: Contains date related parameters for the respective event.
      example:
        ends_at:
          datetime: "2002-04-01T11:41:35Z"
          timezone: Europe/Berlin
        is_all_day: true
        is_time_independent: false
        recurrence_pattern:
          - FREQ=WEEKLY;INTERVAL=1;BYDAY=MO
