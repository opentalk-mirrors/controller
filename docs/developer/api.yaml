---
openapi: 3.1.0
info:
  title: OpenTalk Controller Frontend API
  description: Specifies the endpoints and structure of the OpenTalk Controller Frontend API
  contact:
    name: OpenTalk Team
    email: mail@opentalk.eu
  license:
    name: EUPL-1.2
    identifier: EUPL-1.2
  version: 0.33.0
servers:
  - url: /v1
paths:
  /auth/login:
    get:
      tags:
        - "api::v1::auth"
      summary: Get the configured OIDC provider
      description: |-
        Returns the relevant information for a frontend to authenticate against the
        configured OIDC provider for the OpenTalk service.
      operationId: get_login
      responses:
        "200":
          description: Get information about the OIDC provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLoginResponseBody"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security: []
    post:
      tags:
        - "api::v1::auth"
      summary: "**Deprecated**: This endpoint exists only for backwards compatibility and must no longer be used."
      description: |-
        The login endpoint

        Attempt to authenticate with a provided ID token. The ID token can be
        received from an OIDC provider and contains information about the requesting
        user as well as an expiration timestamp. When a valid token with an unknown user
        is provided, a new user will be created in the database.
      operationId: post_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginPostRequestBody"
        required: true
      responses:
        "200":
          description: "Login successful, answer contains a list of permissions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostLoginResponseBody"
              example:
                permissions: []
        "400":
          description: The provided ID token is malformed or contains invalid claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                code: invalid_claims
                message: some required attributes are missing or malformed
        "401":
          description: The provided ID token is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                code: unauthorized
                message: Authentication failed
        "500":
          $ref: "#/components/responses/InternalServerError"
      deprecated: true
      security: []
  /auth/logout:
    post:
      tags:
        - "api::v1::auth"
      summary: Triggers back-channel OIDC logout
      operationId: post_logout
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PostLogoutRequestBody"
        required: true
      responses:
        "204":
          description: Logout successfull
        "400":
          description: Logout request invalid or logout failed
      security: []
  /events:
    get:
      tags:
        - "api::v1::events"
      summary: Get a list of events and exceptions
      description: |-
        The events and exceptions are sorted chronologically.

        Returns a paginated list of events and their exceptions inside the given time range
      operationId: get_events
      parameters:
        - name: time_min
          in: query
          description: Optional minimum time in which the event happens
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/Timestamp"
        - name: time_max
          in: query
          description: Optional maximum time in which the event happens
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/Timestamp"
        - name: created_before
          in: query
          description: Only query events created before this timestamp
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/Timestamp"
        - name: created_after
          in: query
          description: Only query events created after this timestamp
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/Timestamp"
        - name: invitees_max
          in: query
          description: |-
            Maximum number of invitees to return inside the event resource

            Default value is 0
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/PageSize"
        - name: favorites
          in: query
          description: Return only favorite events
          required: false
          schema:
            type: boolean
        - name: invite_status
          in: query
          description: Filter the events by invite status
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EventInviteStatus"
        - name: per_page
          in: query
          description: How many events to return per page
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/PageSize"
        - name: after
          in: query
          description: |-
            Cursor token to get the next page of events

            Returned by the endpoint if the maximum number of events per page has been hit
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/Cursor_GetEventsCursorData"
        - name: adhoc
          in: query
          description: |-
            Only get events that are either marked as adhoc or non-adhoc

            If present, all adhoc events will be returned when `true`, all non-adhoc
            events will be returned when `false`. If not present, all events will
            be returned regardless of their `adhoc` flag value.
          required: false
          schema:
            type:
              - boolean
              - "null"
        - name: time_independent
          in: query
          description: |-
            Only get events that are either time-independent or time-dependent

            If present, all time-independent events will be returned when `true`,
            all time-dependent events will be returned when `false`. If absent,
            all events will be returned regardless of their time dependency.
          required: false
          schema:
            type:
              - boolean
              - "null"
      responses:
        "200":
          description: List of the events and exceptions
          headers:
            link:
              schema:
                $ref: "#/components/schemas/CursorLink"
              description: Links for paging through the results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventOrException"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    post:
      tags:
        - "api::v1::events"
      summary: Create a new event
      description: Create a new event with the fields sent in the body.
      operationId: new_event
      parameters:
        - name: suppress_email_notification
          in: query
          description: Flag to disable email notification
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostEventsBody"
        required: true
      responses:
        "201":
          description: The event has been created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  /events/instances:
    get:
      tags:
        - "api::v1::events::instances"
      summary: Get a list of events and instances
      description: |-
        The instances are calculated based on the RRULE of the event. If no RRULE is
        set for an event, the event itself is returned

        Returns a paginated list of events or their instances inside the given time range
      operationId: get_events_and_instances
      parameters:
        - name: time_min
          in: query
          description: Optional minimum time in which the event or instance happens
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/Timestamp"
        - name: time_max
          in: query
          description: Optional maximum time in which the event or instance happens
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/Timestamp"
        - name: created_before
          in: query
          description: Only query events created before this timestamp
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/Timestamp"
        - name: created_after
          in: query
          description: Only query events created after this timestamp
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/Timestamp"
        - name: invitees_max
          in: query
          description: |-
            Maximum number of invitees to return inside the event resource

            Default value is 0
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/PageSize"
        - name: instances_max
          in: query
          description: |-
            Maximum number of instances to return for each recurring event

            Default value is 0
          required: false
          schema:
            $ref: "#/components/schemas/ItemCount"
        - name: favorites
          in: query
          description: Return only favorite events
          required: false
          schema:
            type: boolean
        - name: invite_status
          in: query
          description: Filter the events by invite status
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EventInviteStatus"
        - name: per_page
          in: query
          description: How many events and instances to return per page
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/PageSize"
        - name: after
          in: query
          description: |-
            Cursor token to get the next page of events and instances

            Returned by the endpoint if the maximum number of events and instances per page has been hit
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/Cursor_GetEventsAndInstancesCursorData"
        - name: adhoc
          in: query
          description: |-
            Only get events that are either marked as adhoc or non-adhoc

            If present, all adhoc events will be returned when `true`, all non-adhoc
            events will be returned when `false`. If not present, all events will
            be returned regardless of their `adhoc` flag value.
          required: false
          schema:
            type:
              - boolean
              - "null"
        - name: time_independent
          in: query
          description: |-
            Only get events that are either time-independent or time-dependent

            If present, all time-independent events will be returned when `true`,
            all time-dependent events will be returned when `false`. If absent,
            all events will be returned regardless of their time dependency.
          required: false
          schema:
            type:
              - boolean
              - "null"
      responses:
        "200":
          description: List of events and instances successfully returned
          headers:
            link:
              schema:
                $ref: "#/components/schemas/PageLink"
              description: Links for paging through the results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEventInstancesResponseBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  "/events/{event_id}":
    get:
      tags:
        - "api::v1::events"
      summary: Get an event
      description: Returns the event resource for the given id
      operationId: get_event
      parameters:
        - name: invitees_max
          in: query
          description: |-
            Maximum number of invitees to return inside the event resource

            Default value is 0
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/PageSize"
        - name: event_id
          in: path
          description: The id of the event
          required: true
          schema:
            $ref: "#/components/schemas/EventId"
      responses:
        "200":
          description: Event was successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    delete:
      tags:
        - "api::v1::events"
      summary: "Delete an event and its owned resources, including the associated room."
      description: |-
        Deletes the event by the id if found. See the query parameters for affecting
        the behavior of this endpoint, such as mail notification suppression, or
        succeding even if external resources cannot be successfully deleted.
      operationId: delete_event
      parameters:
        - name: force_delete_reference_if_external_services_fail
          in: query
          description: Flag to force delete the reference if the deletion at the external services fails
          required: false
          schema:
            type: boolean
        - name: suppress_email_notification
          in: query
          description: Flag to disable email notification
          required: false
          schema:
            type: boolean
        - name: event_id
          in: path
          description: The id of the event
          required: true
          schema:
            $ref: "#/components/schemas/EventId"
      responses:
        "204":
          description: The event was successfully deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    patch:
      tags:
        - "api::v1::events"
      summary: Patch an event
      description: Fields that are not provided in the request body will remain unchanged.
      operationId: patch_event
      parameters:
        - name: invitees_max
          in: query
          description: Maximum number of invitees to include inside the event
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/PageSize"
        - name: suppress_email_notification
          in: query
          description: Flag to disable email notification
          required: false
          schema:
            type: boolean
        - name: event_id
          in: path
          description: The id of the event
          required: true
          schema:
            $ref: "#/components/schemas/EventId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEventBody"
        required: true
      responses:
        "200":
          description: The event was successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResource"
        "204":
          description: The patch was empty
        "400":
          description: |-
            Could not modify the specified event due to wrong
                            syntax or bad values, for example an invalid timestamp string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  "/events/{event_id}/instances":
    get:
      tags:
        - "api::v1::events::instances"
      summary: Get a list of the instances of an event
      description: |-
        The instances are calculated based on the RRULE of the event. If no RRULE is
        set for the event, the single event instance is returned.

        If no pagination query is added, the default page size is used.
      operationId: get_event_instances
      parameters:
        - name: invitees_max
          in: query
          description: Maximum number of invitees to include inside the event
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/PageSize"
        - name: time_min
          in: query
          description: Minimum time of the event instances
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/Timestamp"
        - name: time_max
          in: query
          description: Maximum time of the event instances
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/Timestamp"
        - name: per_page
          in: query
          description: How many events to return per page
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/PageSize"
        - name: after
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GetEventInstancesCursorData"
            description: |-
              Opaque token which represents T as a base64 string (where T is encoded using postcard)

              Used for cursor based pagination
        - name: event_id
          in: path
          description: The id of the event
          required: true
          schema:
            $ref: "#/components/schemas/EventId"
      responses:
        "200":
          description: List of event instances successfully returned
          headers:
            link:
              schema:
                $ref: "#/components/schemas/PageLink"
              description: Links for paging through the results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEventInstancesResponseBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  "/events/{event_id}/instances/{instance_id}":
    get:
      tags:
        - "api::v1::events::instances"
      summary: Get an event instance
      description: Returns the event instance resource
      operationId: get_event_instance
      parameters:
        - name: event_id
          in: path
          description: ID of the event
          required: true
          schema:
            $ref: "#/components/schemas/EventId"
        - name: instance_id
          in: path
          description: ID of the event instance
          required: true
          schema:
            $ref: "#/components/schemas/InstanceId"
        - name: invitees_max
          in: query
          description: |-
            Maximum number of invitees to return inside the event instance resource

            Default: 0
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/PageSize"
        - name: suppress_email_notification
          in: query
          description: Flag to suppress email notification
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Event instance successfully returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEventInstanceResponseBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    patch:
      tags:
        - "api::v1::events::instances"
      summary: Modifies an event instance
      description: |-
        Patch an instance of a recurring event. This creates or modifies an exception for the event
        at the point of time of the given instance_id.
        Returns the patched event instance
      operationId: patch_event_instance
      parameters:
        - name: event_id
          in: path
          description: ID of the event
          required: true
          schema:
            $ref: "#/components/schemas/EventId"
        - name: instance_id
          in: path
          description: ID of the event instance
          required: true
          schema:
            $ref: "#/components/schemas/InstanceId"
        - name: invitees_max
          in: query
          description: |-
            Maximum number of invitees to return inside the event instance resource

            Default: 0
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/PageSize"
        - name: suppress_email_notification
          in: query
          description: Flag to suppress email notification
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEventInstanceBody"
        required: true
      responses:
        "200":
          description: Event instance successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventInstance"
        "204":
          description: "The request body was empty, no changes required"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  "/events/{event_id}/invite":
    delete:
      tags:
        - "api::v1::events::invites"
      summary: Decline an invite to an event
      description: "No content required, the request will accept the invitation."
      operationId: decline_event_invite
      parameters:
        - name: event_id
          in: path
          description: The id of the event
          required: true
          schema:
            $ref: "#/components/schemas/EventId"
      responses:
        "204":
          description: Invitation was declined
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    patch:
      tags:
        - "api::v1::events::invites"
      summary: Accept an invite to an event
      description: "No content required, the request will accept the invitation."
      operationId: accept_event_invite
      parameters:
        - name: event_id
          in: path
          description: The id of the event
          required: true
          schema:
            $ref: "#/components/schemas/EventId"
      responses:
        "204":
          description: Invitation was accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  "/events/{event_id}/invites":
    get:
      tags:
        - "api::v1::events::invites"
      summary: Get the invites for an event
      description: Returns the list of event invites
      operationId: get_invites_for_event
      parameters:
        - name: pagination
          in: query
          description: Results will be paginated by this pagination specification
          required: true
          schema:
            type: object
            description: Page-based pagination query
            properties:
              page:
                $ref: "#/components/schemas/Page"
                description: The number of the page
              per_page:
                $ref: "#/components/schemas/PageSize"
                description: The number of entries per page
        - name: status
          in: query
          description: "If present, the results will be filtered by that state"
          required: false
          schema:
            oneOf:
              - type: "null"
              - $ref: "#/components/schemas/EventInviteStatus"
        - name: event_id
          in: path
          description: The id of the event
          required: true
          schema:
            $ref: "#/components/schemas/EventId"
      responses:
        "200":
          description: Event instance successfully returned
          headers:
            link:
              schema:
                $ref: "#/components/schemas/CursorLink"
              description: Links for paging through the results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEventInstanceResponseBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    post:
      tags:
        - "api::v1::events::invites"
      summary: Create a new invite to an event
      description: Create a new invite to an event with the fields sent in the body.
      operationId: create_invite_to_event
      parameters:
        - name: suppress_email_notification
          in: query
          description: Flag to suppress email notification
          required: false
          schema:
            type: boolean
        - name: event_id
          in: path
          description: The id of the event
          required: true
          schema:
            $ref: "#/components/schemas/EventId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostEventInviteBody"
        required: true
      responses:
        "201":
          description: The user or email has been invited to the event
        "204":
          description: "The user or email was already invited before, or the user is the creator of the event, in which case they have been invited implicitly"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  "/events/{event_id}/invites/email":
    delete:
      tags:
        - "api::v1::events::invites"
      summary: Delete an invite from an event
      description: |-
        Delete/Withdraw an event invitation using the email address as the identifier.

        This will also withdraw invites from registered users if the provided email address matches theirs.
      operationId: delete_email_invite_to_event
      parameters:
        - name: event_id
          in: path
          description: The id of the event
          required: true
          schema:
