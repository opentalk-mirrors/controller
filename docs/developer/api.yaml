        streaming_links:
          - name: My OwnCast Stream
            url: "https://owncast.example.com/mystream"
    ModuleId:
      anyOf:
        - type: string
          description: A module identifier
          examples:
            - mymodule
          maxLength: 255
          minLength: 1
          pattern: "^[_0-9a-z]*$"
      default: core
      example: mymodule
    NumericId:
      type: string
      description: A string containing number characters
      examples:
        - "0000000000"
      maxLength: 10
      minLength: 10
      pattern: "[0-9]+"
    OidcProvider:
      type: object
      description: Represents an OIDC provider
      required:
