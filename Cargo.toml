[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
homepage = "https://opentalk.eu/"
repository = "https://gitlab.opencode.de/opentalk/controller"
version = "0.33.0"

[workspace.dependencies]
opentalk-cache = { path = "crates/opentalk-cache", version = "0.33.0" }
opentalk-controller-api-actix-web = { path = "crates/opentalk-controller-api-actix-web", version = "0.33.0" }
opentalk-controller-api-authorization = { path = "crates/opentalk-controller-api-authorization", version = "0.33.0" }
opentalk-controller-api-authorization-database = { path = "crates/opentalk-controller-api-authorization-database", version = "0.33.0" }
opentalk-controller-api-authorization-database-synchronization = { path = "crates/opentalk-controller-api-authorization-database-synchronization", version = "0.33.0" }
opentalk-controller-api-authorization-synchronization = { path = "crates/opentalk-controller-api-authorization-synchronization", version = "0.33.0" }
opentalk-controller-core = { path = "crates/opentalk-controller-core", version = "0.33.0" }
opentalk-controller-service = { path = "crates/opentalk-controller-service", version = "0.33.0" }
opentalk-controller-service-facade = { path = "crates/opentalk-controller-service-facade", version = "0.33.0" }
opentalk-controller-settings = { path = "crates/opentalk-controller-settings", version = "0.33.0" }
opentalk-controller-utils = { path = "crates/opentalk-controller-utils", version = "0.33.0" }
opentalk-database = { path = "crates/opentalk-database", version = "0.33.0" }
opentalk-db-storage = { path = "crates/opentalk-db-storage", version = "0.33.0" }
opentalk-inventory = { path = "crates/opentalk-inventory", version = "0.33.0" }
opentalk-inventory-common = { path = "crates/opentalk-inventory-common", version = "0.33.0" }
opentalk-inventory-database = { path = "crates/opentalk-inventory-database", version = "0.33.0" }
opentalk-jobs = { path = "crates/opentalk-jobs", version = "0.33.0" }
opentalk-log = { path = "crates/opentalk-log", version = "0.33.0" }
opentalk-r3dlock = { path = "crates/opentalk-r3dlock", version = "0.33.0" }
opentalk-signaling-core = { path = "crates/opentalk-signaling-core", version = "0.33.0" }
opentalk-test-util = { path = "crates/opentalk-test-util", version = "0.33.0" }

actix-http = "3"
actix-rt = "2"
actix-web = { version = "4", default-features = true }
actix-web-httpauth = "0.8"
actix-ws = "0.4.0"
anstream = "1.0"
arc-swap = "1"
async-stream = "0.3"
async-trait = "0.1"
aws-sdk-s3 = { version = "1.129.0", features = ["behavior-version-latest"] }
axum = "0.8"
base64 = "0.22"
bigdecimal = "0.4"
byteorder = "1.5"
bytes = "1"
bytestring = "1"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
derive_more = "2.1"
diesel = "2"
diesel-async = "0.7"
dirs = "6"
either = "1"
env_logger = "0.11"
fluent-langneg = "0.14.2"
flume = "0.11"
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3.32"
glob = "0.3.3"
http = "1"
http-request-derive = { version = "0.6.0", default-features = false }
http0 = { version = "0", package = "http" }
humansize = "2.1.3"
iana-time-zone = "0.1.65"
icu_locid = "1"
insta = "1"
itertools = "0.14"
jsonwebtoken = "10"
language-tags = "0.3.2"
lapin = { version = "2", default-features = false }
lapin-pool = "0.1"
log = "0.4"
md5 = "0.8"
mockall = "0.14"
oauth2 = "5.0.0"
openidconnect = "4"
opentalk-diesel-newtype = "0.13"
opentalk-keycloak-admin = "0.5.1"
opentalk-mail-worker-protocol = "0.44.0"
opentalk-nextcloud-client = "0.3.0"
opentalk-report-generation = "0.2.0"
opentalk-roomserver-client = "0.0.34"
opentalk-roomserver-modules = "0.0.34"
opentalk-roomserver-types = "0.0.34"
opentalk-roomserver-types-livekit = "0.0.34"
opentalk-roomserver-types-training-participation-report = "0.0.34"
opentalk-service-auth = { version = "0.2.2", default-features = false }
opentalk-types-api-internal = "0.2.0"
opentalk-types-api-v1 = "0.58.0"
opentalk-types-common = "0.43.1"
opentalk-types-signaling = "0.45.0"
opentalk-version = "0.4.0"
opentelemetry = { version = "0.29.1", default-features = false, features = [
  "metrics",
  "trace",
] }
opentelemetry-otlp = "0.29.0"
opentelemetry-prometheus = "0.29.1"
opentelemetry_sdk = { version = "0.29.0", features = [
  "metrics",
  "rt-tokio-current-thread",
  "spec_unstable_metrics_views",
] }
owo-colors = "4"
parking_lot = "0.12"
parse-size = "1.1.0"
pdf-extract = "0.10"
percent-encoding = "2.3"
phonenumber = "0.3"
pretty_assertions = "1"
prometheus = "0.14.0"
rand = "0.10"
rand_chacha = "0.10"
redis = "1"
redis-args = "0.22.1"
reqwest = { version = "0.13", default-features = false }
ring = "0.17"
rkyv = "0.8.15"
rrule = "0.14"
rustc-hash = "2.1"
rustls = "0.23"
scoped-futures = "0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3.18.0"
serial_test = "3"
snafu = "0.9.0"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
tokio = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.1"
tracing = "0.1"
tracing-opentelemetry = "0.30.0"
url = "2"
utoipa = "5"
utoipa-swagger-ui = "9"
uuid = "1"
yaml-rust2 = "0.11.0"

[workspace.dependencies.casbin]
default-features = false
git = "https://github.com/kbalt/casbin-rs.git"
rev = "fddb52d61385913727e24a5c7337eed489cb0d56"

[workspace.lints.clippy]
self_named_module_files = "deny"
